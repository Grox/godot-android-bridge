name: Test YT Music WebView on Android Emulator

on:
  push:
    paths:
      - '.github/workflows/test-ytmusic-webview-android.yml'
  workflow_dispatch:

jobs:
  android-webview-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create native WebView probe app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p webview-probe/app/src/main/java/com/openai/ytmusictest
          mkdir -p webview-probe/app/src/main/res/values

          cat > webview-probe/settings.gradle <<'EOF2'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'YTMusicWebViewProbe'
          include ':app'
          EOF2

          cat > webview-probe/build.gradle <<'EOF2'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF2

          cat > webview-probe/app/build.gradle <<'EOF2'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.openai.ytmusictest'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.openai.ytmusictest'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF2

          cat > webview-probe/app/src/main/AndroidManifest.xml <<'EOF2'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:theme="@style/AppTheme" android:usesCleartextTraffic="false" android:hardwareAccelerated="true">
                  <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF2

          cat > webview-probe/app/src/main/res/values/styles.xml <<'EOF2'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF2

          cat > webview-probe/app/src/main/java/com/openai/ytmusictest/MainActivity.java <<'EOF2'
          package com.openai.ytmusictest;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.util.Log;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private static final String TAG = "YTMusicProbe";
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  WebView.setWebContentsDebuggingEnabled(true);
                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.rgb(24, 24, 24));

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(webView, true);

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override public void onPageFinished(WebView view, String url) {
                          Log.i(TAG, "PAGE_FINISHED=" + url);
                          view.evaluateJavascript("document.title", v -> Log.i(TAG, "TITLE=" + v));
                          view.evaluateJavascript("document.body ? document.body.innerText.length : -1", v -> Log.i(TAG, "BODY_TEXT_LENGTH=" + v));
                      }
                      @Override public void onReceivedError(WebView view, WebResourceRequest req, WebResourceError err) {
                          if (req.isForMainFrame()) Log.e(TAG, "MAIN_FRAME_ERROR=" + err.getErrorCode() + ":" + err.getDescription());
                      }
                  });

                  setContentView(webView);
                  webView.loadUrl("https://music.youtube.com/");
              }

              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF2

      - name: Build probe APK
        working-directory: webview-probe
        run: gradle --no-daemon :app:assembleDebug

      - name: Run APK in Android emulator and capture evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_4
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euo pipefail
            adb wait-for-device
            adb shell getprop sys.boot_completed
            adb install -r webview-probe/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.openai.ytmusictest
            adb shell am start -W -n com.openai.ytmusictest/.MainActivity
            sleep 30
            adb exec-out screencap -p > webview-screen.png
            adb logcat -d -v threadtime > webview-logcat.txt
            adb shell uiautomator dump /sdcard/window.xml >/dev/null || true
            adb pull /sdcard/window.xml webview-window.xml || true
            grep -E 'YTMusicProbe|chromium|WebView|cr_' webview-logcat.txt > webview-relevant.log || true
            if grep -q 'MAIN_FRAME_ERROR=' webview-relevant.log; then
              cat webview-relevant.log
              exit 1
            fi
            grep 'PAGE_FINISHED=https://music.youtube.com' webview-relevant.log

      - name: Analyze screenshot for black-screen regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageStat
          im=Image.open('webview-screen.png').convert('RGB')
          thumb=im.resize((120, 240))
          colors=len(set(thumb.getdata()))
          stat=ImageStat.Stat(thumb)
          mean=sum(stat.mean)/3
          std=sum(stat.stddev)/3
          result=f'unique_colors={colors}\nmean={mean:.2f}\nstddev={std:.2f}\n'
          print(result)
          open('webview-metrics.txt','w').write(result)
          if colors < 50 or std < 4:
              raise SystemExit('BLACK_OR_FLAT_SCREEN_DETECTED')
          PY

      - name: Upload screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ytmusic-webview-emulator-evidence
          path: |
            webview-screen.png
            webview-logcat.txt
            webview-relevant.log
            webview-window.xml
            webview-metrics.txt
          if-no-files-found: warn
